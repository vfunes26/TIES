<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cita Previa - Tramite</title>
</head>
<body>
<div id="cookie_action_close_header" style="padding:8px;background:#eee;margin:5px;cursor:pointer" onclick="this.style.display='none'" title="Cerrar">Cookie banner - click to close</div>
<form name="procedimientos" action="/icpco/advance" method="post">
    <fieldset>
        <legend>Selecciona Oficina</legend>
        <label for="idSede">Oficina:</label>
        <select id="idSede" name="idSede">
            <option value="">Cualquier oficina</option>
        </select>
    </fieldset>
    <fieldset>
        <legend>Selecciona el trámite</legend>
        <label for="tramiteGrupo[0]">Trámites Policía Nacional:</label>
        <select id="tramiteGrupo[0]" name="tramiteGrupo[0]">
            <option value="">Seleccione...</option>
            <option value="4010">POLICÍA-TOMA DE HUELLAS (EXPEDICIÓN DE TARJETA) INICIAL, RENOVACIÓN, DUPLICADO Y LEY 14/2013</option>
        </select>
    </fieldset>
    <button type="submit" id="btnAceptar" class="mf-button primary">Aceptar</button>
</form>
</body>
</html>
