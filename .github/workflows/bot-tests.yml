name: Tests del bot (Node)

on:
  push:
    paths: ["bot/**", "shared/**", ".github/workflows/bot-tests.yml"]
  pull_request:
    paths: ["bot/**", "shared/**"]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm run test:unit
