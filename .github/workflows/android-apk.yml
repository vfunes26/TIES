name: Compilar APK (Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", "shared/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android/**", "shared/**"]
  workflow_dispatch:

permissions:
  contents: write   # necesario solo para publicar el APK en "Releases" al crear una etiqueta v*

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Instala Gradle sin necesidad de gradlew (el wrapper no está en el repo).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prueba del motor de autorrelleno (DOM simulado)
        run: node android/app/src/test/js/autofill.test.js

      - name: Tests unitarios (alertas, NIE/DNI, catálogo, nacionalidades, cola, estadísticas)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Compilar APK de depuración (instalable directamente)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # APK firmado (opcional): solo si has definido los 4 secretos en Settings → Secrets → Actions.
      - name: Compilar APK firmado (release)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CitaAsistente-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
