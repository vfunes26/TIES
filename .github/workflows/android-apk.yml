
name: Compilar APK (Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prueba del motor de autorrelleno
        run: node android/app/src/test/js/autofill.test.js

      - name: Tests unitarios
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Compilar APK Debug
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug \
            -PversionCode="$VERSION_CODE" \
            -PversionName="0.1.$VERSION_CODE"

      - name: Verificar firma para publicación
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Faltan secretos de firma para publicar una versión."
            exit 1
          fi

      - name: Compilar APK Release firmado
        if: github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        working-directory: android
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"

          gradle --no-daemon assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="0.1.$VERSION_CODE"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TIES-APK-v0.1.${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publicar versión en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
